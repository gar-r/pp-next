name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: 📥 Checkout from Git
      uses: actions/checkout@v4

    - name: 🔧 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: 🔨 Build
      run: go build -v ./...

    - name: 🧪 Test
      run: go test -v ./...

    - name: 🤖 Static analysis
      run: go vet ./...
